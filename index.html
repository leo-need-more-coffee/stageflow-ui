<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StageFlow Editor</title>
  <!-- Manrope for the interface, IBM Plex Mono for identifiers and code;
       offline the system fallbacks from --ui / --mono take over -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div id="editor"></div>
  <script type="module">
    import { connectBridge } from "./js/bridge.js";
    import { connectBackend } from "./js/connect.js";
    import { createEditor } from "./js/editor.js";
    import { loadLocale, t } from "./js/i18n.js";

    const storageKey = "stageflow-editor";

    // The language is settled before anything is drawn, and the connection
    // screen is the first thing drawn: `?lang=ru` in a link, otherwise what was
    // chosen here last time, otherwise what the browser asks for. Every other
    // i18n call is synchronous, so no rendering code ever waits on a word.
    await loadLocale();

    // The editor is static front-end: the stages and the run API live on a
    // StageFlow backend, and which one that is the user says on the connection
    // screen. `?backend=http://host:port` skips the question — handy for a
    // bookmark or a demo; the address is remembered either way.
    //
    // `?plan=basic` asks that backend to answer about that plan instead of
    // this caller's own: a link that opens the editor as the cheaper tier
    // sees it. It changes what is DRAWN, never what a run is allowed — that
    // the backend decides from the credential, and refuses a mismatch.
    const query = new URLSearchParams(location.search);
    const backend = await connectBackend({
      storageKey,
      url: query.get("backend"),
      plan: query.get("plan"),
    });

    window.editor = createEditor(document.getElementById("editor"), {
      backend,
      // the session survives a reload: the graph, the view and the panel layout
      storageKey,
      onChange: (pipeline) => console.debug("pipeline changed", pipeline),
    });

    // `?bridge=http://127.0.0.1:7433#bridge-token=…` — an agent working on
    // this graph from somewhere else (stageflow-mcp --bridge). Without the
    // parameter nothing here runs and nothing is drawn. The token is in the
    // fragment on purpose: this page is served by somebody else, and a query
    // parameter would be in their log and in every Referer.
    connectBridge(window.editor, {
      onState: (state, detail) => {
        const said = {
          connecting: () => [t("bridge.connecting"), t("bridge.about")],
          live: () => [detail ? t("bridge.did", { note: detail }) : t("bridge.live"),
                       t("bridge.about")],
          lost: () => [t("bridge.lost"), detail || ""],
        }[state];
        const [text, title] = said ? said() : ["", ""];
        window.editor.setStatusNote("bridge", text, title);
      },
    }).then((bridge) => { if (bridge) window.bridge = bridge; });
  </script>
</body>
</html>
